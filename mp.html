<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet"><title>Mis XV Años</title>

<style>
:root{
 --marfil: #cba97c;
    --bordo: #3b1d29;  /*4b1e2f*/
    --dorado: #e6d3a3;
    --tinta: #2b2b2b;
    --dorado-suave: #e6d3a3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:40px 18px;

  font-family:'Montserrat', sans-serif;

  color:var(--tinta);

  background:
    var(--marfil);

  position:relative;

  overflow-x:hidden;
}

/* textura suave */

body::before{

  content:"";

  position:fixed;
  inset:0;

  background-image:
  radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);


  opacity:0.20;

  pointer-events:none;
}

/* tarjeta */

.card{

  width:100%;
  max-width:430px;

  background: #f5dfc2;

  backdrop-filter:blur(3px);

  border:2px solid var(--dorado-suave);

  border-radius:18px;

  padding:48px 28px;

  position:relative;

  box-shadow:
  0 10px 30px rgba(43,43,43,0.15);

  text-align:center;
}

/* doble borde */

.card::before{

  content:"";

  position:absolute;

  inset:10px;

  border:2px solid var(--dorado);

  border-radius:12px;

  pointer-events:none;
}

/* ornamento */

.ornament{

  font-size:24px;

  color:var(--bordo);

  margin-bottom:28px;

  letter-spacing:6px;
}

/* titulo */

h1{

font-family: 'Cinzel Decorative', serif;
  font-weight:600;
  font-size:38px;
  color:var(--bordo);

  letter-spacing:6px;

  text-transform:uppercase;

  line-height:1.3;

  margin-bottom:18px;
}

/* subtitulo */

.subtitle{

  margin:24px;

  color:var(--bordo);

  font-size:13px;

  letter-spacing:2px;

  line-height:1.8;
}

/* cajas */

.info-box{

  background:rgba(230,211,163,0.18);

  border:2px solid var(--marfil);

  border-radius:14px;

  padding:22px 18px;

  margin-bottom:18px;

  position:relative;
}

/* detalle lateral */

.info-box::before{

  content:"✦";

  position:absolute;

  left:14px;

  top:50%;

  transform:translateY(-50%);

  color:rgba(59,29,41,0.45);

  font-size:12px;
}

.label{

  font-size:11px;

  letter-spacing:4px;

  text-transform:uppercase;

  color:var(--bordo);

  margin-bottom:10px;
}

.value{

  font-size:17px;

  color:var(--tinta);

  line-height:1.6;

  word-break:break-word;
}

/* botón */

button{

  width:100%;

  margin-top:12px;

  padding:17px;

  border-radius:14px;

  border:1px solid var(--marfil);

  background:var(--bordo);

  color:var(--dorado);

  font-family:'Montserrat', sans-serif;

  font-size:15px;

  letter-spacing:1px;

  cursor:pointer;

  transition:0.3s;
}

button:hover{

  background:var(--tinta);

  color:var(--dorado-suave);
}

/* footer */

.footer{

  margin-top:32px;

  color:var(--bordo);

  font-size:13px;

  letter-spacing:2px;

  line-height:1.8;
}

/* responsive */

@media(max-width:600px){

  body{
    padding:20px 12px;
  }

  .card{
    padding:40px 22px;
  }

  h1{
    font-size:34px;
    letter-spacing:4px;
  }

  .subtitle{
    font-size:14px;
  }

  .value{
    font-size:15px;
  }

}

</style>
</head>

<body>

<div class="card">

  <div class="ornament">
    ✦ ⚜ ✦
  </div>

  <h1>
    Mis quince
    <br>
    Años
  </h1>


  <div class="info-box">

    <div class="label">
      Titular
    </div>

    <div class="value">
      Fatima Valentina Turkalj
    </div>

  </div>

  <div class="info-box">

    <div class="label">
      Alias
    </div>

    <div class="value" id="alias">
      fatimaturkalj
    </div>

  </div>

  <div class="info-box">

    <div class="label">
      CVU
    </div>

    <div class="value" id="cvu">
      0000003100010472056456
    </div>

  </div>

  <button onclick="copiarDatos()">
    Copiar información
  </button>

  <div class="footer">
    Gracias por acompañarme
    <br>
    en este momento tan especial
  </div>

</div>

<script>

function copiarDatos(){

  const alias =
  document.getElementById("alias").innerText;

  const cvu =
  document.getElementById("cvu").innerText;

  const texto =
`Alias: ${alias}
CVU: ${cvu}`;

  navigator.clipboard.writeText(texto);

  alert("Información copiada ✨");

}

</script>

</body>
</html>
